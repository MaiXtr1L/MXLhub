<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1824" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)" stroke="url(#avatarGlow)" stroke-width="3" />
  
  <!-- Subtle futuristic grid / ring -->
  <circle cx="100" cy="100" r="82" stroke="#00F2FE" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />
  <circle cx="100" cy="100" r="70" stroke="#4FACFE" stroke-width="0.75" opacity="0.25" />

  <!-- Stylized avatar silhouette / crest -->
  <g fill="none" stroke="url(#avatarGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="80" r="28" stroke-width="3.5" fill="#0E1620" />
    <!-- Visor / Neon line across head -->
    <path d="M82 80 Q100 85 118 80" stroke-width="3" filter="url(#softGlow)" />
    <!-- Shoulders / Torso -->
    <path d="M52 145 C52 118 74 114 100 114 C126 114 148 118 148 145" stroke-width="3.5" fill="#0E1620" />
    <!-- Cyber collar accents -->
    <path d="M85 116 L100 130 L115 116" stroke-width="2" opacity="0.8" />
  </g>
</svg>
