<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <defs>
    <linearGradient id="turquoiseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Geometric Symbol / Icon -->
  <g transform="translate(20, 15)">
    <!-- Outer hexagon/shield ring -->
    <path d="M25 0 L50 14.4 L50 35.6 L25 50 L0 35.6 L0 14.4 Z" 
          stroke="url(#turquoiseGlow)" stroke-width="2.5" fill="#0A1017" fill-opacity="0.8" />
    <!-- Inner glowing core -->
    <path d="M25 10 L40 18.5 L40 31.5 L25 40 L10 31.5 L10 18.5 Z" 
          fill="url(#turquoiseGlow)" opacity="0.2" />
    <!-- Neon letter 'M' styling -->
    <path d="M16 32 L16 19 L25 27 L34 19 L34 32" 
          stroke="url(#turquoiseGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Small cyan energy point -->
    <circle cx="25" cy="11" r="2.5" fill="#00F2FE" filter="url(#glow)" />
  </g>

  <!-- Typography: Brand Name -->
  <text x="88" y="47" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="3" fill="#FFFFFF">
    MXL<tspan fill="url(#turquoiseGlow)">HUB</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="90" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="9" letter-spacing="4" fill="#67E8F9" opacity="0.85">
    OFFICIAL LINKS
  </text>
</svg>
